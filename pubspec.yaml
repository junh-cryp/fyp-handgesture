name: handgesture
description: "Final Year Project - Hand Gesture Recognition using MediaPipe"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- THE AI & CAMERA STACK ---
  hand_landmarker: ^3.0.1
  google_mlkit_pose_detection: ^0.15.0
  camera: ^0.12.0+1
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  cloud_firestore: ^6.4.0
  flutter_tts: ^4.2.2
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hand_landmarker.task
    - assets/gestures/
